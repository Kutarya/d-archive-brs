[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "muvv"
dynamic = ["version"]
description = "Linux HID mouse controls and layered RGB effects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["hidapi==0.15.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]

[project.optional-dependencies]
gui = ["customtkinter==6.0.0"]
dev = ["ruff==0.17.0", "coverage==7.13.5", "build==1.6.1", "pip-audit==2.10.1"]

[project.scripts]
muvv = "cli:main"
muvvd = "daemon:main"
muvv-gui = "gui:main"

[tool.setuptools]
py-modules = ["cli", "daemon", "gui", "demo", "ipc_protocol", "schemas", "profile_io", "diagnostics", "app_version", "ui_client", "keyboard_keys"]

[tool.setuptools.dynamic]
version = {attr = "app_version.__version__"}

[tool.setuptools.packages.find]
include = ["animations*", "drivers*", "managers*"]
exclude = ["test*", "tools*"]

[tool.ruff]
target-version = "py310"
line-length = 110
include = ["*.py", "pyproject.toml"]
extend-exclude = ["test/hardware", "test/manager/test_manager.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"test/manager/test_*.py" = ["E402", "F401"]

[tool.coverage.run]
branch = true
source = ["animations", "drivers", "managers", "cli", "ipc_protocol", "daemon", "demo", "profile_io", "diagnostics", "ui_client", "keyboard_keys", "app_version"]
omit = ["*/.venv/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
